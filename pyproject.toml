[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-docx-polish"
version = "0.1.0"
description = "Chinese SOE/public-formal DOCX polish and validation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Yuhamixli" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "python-docx>=1.1.2"
]
keywords = [
  "docx",
  "word",
  "gongwen",
  "formal-document",
  "soe",
  "cursor-skill"
]

[project.urls]
Homepage = "https://github.com/Yuhamixli/formal-docx-polish"
Repository = "https://github.com/Yuhamixli/formal-docx-polish"
Issues = "https://github.com/Yuhamixli/formal-docx-polish/issues"

[project.scripts]
formal-docx-polish = "formal_docx_polish.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
formal_docx_polish = ["profiles/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
